
<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion | Promographe</title>
  <link rel="icon" href="/favicon.png" type="image/png">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #f2f5f9;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #26364a;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
      background: white;
      border-radius: 16px;
      padding: 38px;
      box-shadow: 0 12px 40px rgba(24, 53, 84, 0.10);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand-icon {
      width: 60px;
      height: 60px;
      margin: 0 auto 14px;
      border-radius: 14px;
      background: #174a7e;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 27px;
      font-weight: bold;
    }

    h1 {
      margin: 0;
      color: #174a7e;
      font-size: 27px;
    }

    .subtitle {
      color: #718096;
      font-size: 14px;
      margin-top: 9px;
    }

    [hidden] {
      display: none !important;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-size: 14px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #d8e0e9;
      border-radius: 8px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #174a7e;
      box-shadow: 0 0 0 3px rgba(23, 74, 126, 0.10);
    }

    button {
      width: 100%;
      margin-top: 25px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #174a7e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #10375e;
    }

    .message {
      margin-top: 16px;
      font-size: 14px;
      text-align: center;
      color: #b42318;
      min-height: 18px;
    }

    .microsoft-button {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 13px;
      border: 1px solid #8c8c8c;
      border-radius: 8px;
      background: white;
      color: #26364a;
      font-size: 15px;
      font-weight: 600;
      text-decoration: none;
    }

    .microsoft-button:hover {
      background: #f3f6fa;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 22px 0 4px;
      color: #8995a5;
      font-size: 13px;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: #d8e0e9;
    }

    .forgot {
      margin: 6px 0 0;
      text-align: center;
      font-size: 14px;
    }

    .forgot a {
      color: #174a7e;
    }

    footer {
      margin-top: 28px;
      text-align: center;
      font-size: 12px;
      color: #8995a5;
    }
  </style>
</head>

<body>
  <main class="login-container">
    <div class="brand">
      <div class="brand-icon">P</div>
      <h1>Promographe</h1>
      <p class="subtitle">Gestion des commandes et des achats</p>
    </div>

    <div id="microsoftSignIn" hidden>
      <a class="microsoft-button" href="/api/auth/microsoft/login">
        <svg width="18" height="18" viewBox="0 0 21 21" aria-hidden="true">
          <rect x="1" y="1" width="9" height="9" fill="#f25022"></rect>
          <rect x="11" y="1" width="9" height="9" fill="#7fba00"></rect>
          <rect x="1" y="11" width="9" height="9" fill="#00a4ef"></rect>
          <rect x="11" y="11" width="9" height="9" fill="#ffb900"></rect>
        </svg>
        Se connecter avec Microsoft
      </a>
      <p class="divider"><span>ou</span></p>
    </div>

    <form id="loginForm">
      <label for="email">Adresse courriel</label>
      <input
        id="email"
        name="email"
        type="email"
        placeholder="nom@entreprise.ca"
        autocomplete="username"
        required
      >

      <label for="password">Mot de passe</label>
      <input
        id="password"
        name="password"
        type="password"
        placeholder="Entrez votre mot de passe"
        autocomplete="current-password"
        required
      >

      <button id="submitButton" type="submit">Se connecter</button>

      <p class="message" id="message" role="alert"></p>
      <p class="forgot"><a href="/forgot-password.html">Mot de passe oublié ?</a></p>
    </form>

    <footer>
      Promographe · Plateforme interne de gestion
    </footer>
  </main>

  <script src="/login.js"></script>
</body>
</html>
