<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Activer mon compte | Promographe</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #f2f5f9;
      color: #26364a;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 40px rgba(24, 53, 84, 0.10);
    }

    h1 {
      margin-top: 0;
      color: #174a7e;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8e0e9;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #174a7e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #message {
      min-height: 20px;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <h1>Activer mon compte</h1>
    <p id="invitationInfo">Vérification du lien d’invitation…</p>
    <form id="acceptForm" hidden>
      <label for="password">Choisir un mot de passe</label>
      <input id="password" name="password" type="password" minlength="12" maxlength="256"
        autocomplete="new-password" required>
      <label for="passwordConfirmation">Confirmer le mot de passe</label>
      <input id="passwordConfirmation" name="passwordConfirmation" type="password"
        minlength="12" maxlength="256" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Activer mon compte</button>
    </form>
    <p id="message" role="status"></p>
  </main>
  <script>
    const form = document.getElementById("acceptForm");
    const info = document.getElementById("invitationInfo");
    const message = document.getElementById("message");
    const submitButton = document.getElementById("submitButton");
    const invitationToken = new URLSearchParams(window.location.hash.slice(1)).get("token");
    window.history.replaceState(null, "", window.location.pathname);

    async function readJson(response) {
      const data = await response.json();
      if (!response.ok) {
        throw new Error(data.error || "Une erreur est survenue.");
      }
      return data;
    }

    async function initialize() {
      if (!invitationToken) {
        throw new Error("Ce lien d’invitation est invalide ou expiré.");
      }
      const response = await fetch("/api/invitations/validate", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: invitationToken })
      });
      const invitation = await readJson(response);
      info.textContent = `Invitation pour ${invitation.email} · Département ${invitation.departmentName}`;
      form.hidden = false;
    }

    initialize().catch(error => {
      info.textContent = "";
      message.textContent = error.message;
    });

    form.addEventListener("submit", async event => {
      event.preventDefault();
      const password = form.elements.password.value;
      if (password !== form.elements.passwordConfirmation.value) {
        message.textContent = "Les deux mots de passe ne correspondent pas.";
        return;
      }

      submitButton.disabled = true;
      message.textContent = "";
      try {
        const csrfResponse = await fetch("/api/auth/csrf");
        const { csrfToken } = await readJson(csrfResponse);
        const response = await fetch("/api/invitations/accept", {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "X-CSRF-Token": csrfToken
          },
          body: JSON.stringify({ token: invitationToken, password })
        });
        if (!response.ok) {
          const data = await response.json();
          throw new Error(data.error || "L’activation a échoué.");
        }
        form.hidden = true;
        info.textContent = "Votre compte est activé. Vous pouvez maintenant vous connecter.";
        const loginLink = document.createElement("a");
        loginLink.href = "/login.html";
        loginLink.textContent = "Aller à la connexion";
        message.replaceChildren(loginLink);
      } catch (error) {
        message.textContent = error.message;
        submitButton.disabled = false;
      }
    });
  </script>
</body>
</html>
