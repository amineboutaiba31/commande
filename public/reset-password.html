<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>Nouveau mot de passe | Promographe</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #f2f5f9;
      color: #26364a;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 40px rgba(24, 53, 84, 0.10);
    }

    h1 {
      margin-top: 0;
      color: #174a7e;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8e0e9;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #174a7e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #message {
      min-height: 20px;
      color: #b42318;
    }
  </style>
</head>
<body>
  <main>
    <h1>Nouveau mot de passe</h1>
    <p id="resetInfo">Vérification du lien…</p>
    <form id="resetForm" hidden>
      <label for="password">Nouveau mot de passe <small>(12 caractères minimum)</small></label>
      <input id="password" name="password" type="password" minlength="12" maxlength="256"
        autocomplete="new-password" required>
      <label for="passwordConfirmation">Confirmer le mot de passe</label>
      <input id="passwordConfirmation" name="passwordConfirmation" type="password"
        minlength="12" maxlength="256" autocomplete="new-password" required>
      <button id="submitButton" type="submit">Enregistrer le mot de passe</button>
    </form>
    <p id="message" role="status"></p>
  </main>
  <script src="/reset-password.js"></script>
</body>
</html>
