<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mot de passe oublié | Promographe</title>
  <link rel="icon" href="/favicon.png" type="image/png">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: grid;
      place-items: center;
      background: #f2f5f9;
      color: #26364a;
      font-family: Arial, sans-serif;
    }

    main {
      width: 100%;
      max-width: 460px;
      padding: 36px;
      border-radius: 16px;
      background: white;
      box-shadow: 0 12px 40px rgba(24, 53, 84, 0.10);
    }

    h1 {
      margin-top: 0;
      color: #174a7e;
    }

    label {
      display: block;
      margin: 18px 0 8px;
      font-weight: 600;
    }

    input {
      width: 100%;
      padding: 12px;
      border: 1px solid #d8e0e9;
      border-radius: 8px;
      font-size: 15px;
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #174a7e;
      color: white;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #message {
      min-height: 20px;
      color: #b42318;
    }

    #message.success {
      color: #24764a;
    }

    .back {
      margin-top: 20px;
      text-align: center;
      font-size: 14px;
    }

    .back a {
      color: #174a7e;
    }
  </style>
</head>
<body>
  <main>
    <h1>Mot de passe oublié</h1>
    <p>Saisissez l’adresse courriel de votre compte. Si elle correspond à un compte actif, vous recevrez un lien pour choisir un nouveau mot de passe. Ce lien est valable 1 heure.</p>
    <form id="forgotForm">
      <label for="email">Adresse courriel</label>
      <input id="email" name="email" type="email" maxlength="254" autocomplete="username"
        placeholder="nom@entreprise.ca" required>
      <button id="submitButton" type="submit">Recevoir le lien</button>
    </form>
    <p id="message" role="status"></p>
    <p class="back"><a href="/login.html">Retour à la connexion</a></p>
  </main>
  <script src="/forgot-password.js"></script>
</body>
</html>
